# Two jobs. `fast` runs the fast test suite: label_tool, the skill's
# references and the plugin's packaging. Tests that call the model (`model`) or need the claude
# CLI (`claude_cli`) are left out; run those by hand (see README.md, Tests).
# `skills-discovery` checks what the skills CLI would install (see below).
name: tests

on:
  push:
  pull_request:

jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install FFmpeg for the video tests
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install the harness that runs the React label component
        run: npm ci --prefix tests/evals/site
      - name: Run the fast suite
        run: uv run pytest -m "not model and not claude_cli"

  # Runs the real skills CLI (skills.sh) against the checkout and fails
  # unless the only skill it lists is eu-ai-labelling. It guards against a
  # development skill under .claude/skills/ or .agents/skills/ being offered
  # to users who run `npx skills add condensetech/eu-ai-labelling`. The CLI
  # version is pinned so the check changes only when someone bumps it. If it
  # fails because development skills show up, follow the fallback plan in
  # .scratch/skills-sh/spec.md ("If the discovery check ever fails").
  skills-discovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.20"
      - name: Check that the skills CLI lists only eu-ai-labelling
        run: .github/scripts/check-skills-discovery.sh 1.7.6
