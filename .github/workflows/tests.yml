name: video-ci-diagnostic
on: push
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Inspect HLG failure
        run: |
          uv run python - <<'PY'
          import sys, tempfile, json
          from pathlib import Path
          sys.path.insert(0, "tests")
          from videos import hlg_video, real_tools
          from conftest import run_label_tool
          with tempfile.TemporaryDirectory() as temp:
              root = Path(temp)
              source = hlg_video(root / "clip.mp4")
              result = run_label_tool("video-apply", source, "--variant", "generated", env=real_tools(root / "bin"))
              print(json.dumps(result.json, indent=2))
              print(result.stderr)
              sys.exit(result.returncode)
          PY
