# Test harness only. The plugin itself ships no Python package: label_tool
# declares its own dependencies inline (PEP 723) and is run with `uv run`.
[project]
name = "eu-ai-labelling-tests"
version = "0.0.0"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
# c2pa-python and cryptography build the signed C2PA fixtures of the marking tests.
dev = ["pytest>=8", "pillow>=11", "resvg-py>=0.5", "c2pa-python>=0.38,<0.39", "cryptography>=42"]

[tool.uv]
package = false
# Some c2pa-python releases ship wheels for only some platforms (0.38.2: macOS
# only), so the lock must pick one with wheels for CI (Linux) and macOS.
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "claude_cli: needs the claude CLI; skipped when it is not installed",
    "model: calls the model; skipped unless EU_AI_LABELLING_E2E_DIR is set and the claude CLI is installed",
]
